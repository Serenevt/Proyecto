server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Deferred DNS permits standalone frontend2 without a running backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    location ^~ /api/v1/ {
        client_max_body_size 16k;
        proxy_set_header x-kiosk-key "";
        proxy_set_header Cookie "";
        proxy_set_header Host backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass $backend;
        add_header Cache-Control "no-store" always;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ /\. {
        return 404;
    }

    # Missing assets return 404, not the SPA HTML.
    location ~* \.(?:js|css|png|jpe?g|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Current navigation uses hashes; also allow direct SPA entry URLs.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
