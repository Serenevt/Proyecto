server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing assets return 404, not the SPA HTML.
    location ~* \.(?:js|css|png|jpe?g|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Current navigation uses hashes; also allow direct SPA entry URLs.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
