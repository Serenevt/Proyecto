# =============================================================================
# FuelFlow Autónomo · Primax — configuración Nginx del frontend
# -----------------------------------------------------------------------------
# Rutas y por qué:
#   El index.html está en  /usr/share/nginx/html/src/index.html
#   y sus assets usan "../assets/img/..."  (suben un nivel desde src/).
#
#   Por eso el root es  /usr/share/nginx/html/  y NO  .../html/src/.
#   De ese modo:
#     - /                  -> redirige a  /src/index.html
#     - /src/index.html    -> el sitio, con "../assets/img/" resolviendo
#                              a /assets/img/... dentro de la misma imagen
#     - /assets/img/...    -> las imágenes
# =============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # --- Codificación y compresión ---
    charset utf-8;

    # Nginx no conoce que el puerto 80 del contenedor se publica como 8081 en
    # el host. Con redirect absoluto generaría "Location: http://localhost/..."
    # SIN el puerto y el navegador se iría al puerto 80 (donde no hay nada).
    # Con redirect relativo responde "Location: /src/index.html" y el
    # navegador conserva el host:puerto que usó.
    absolute_redirect   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      image/svg+xml;

    # --- Raíz: padre de src/ para que "../assets/..." resuelva bien ---
    root /usr/share/nginx/html;
    index index.html;

    # --- Caché de estáticos ---
    # Las imágenes casi nunca cambian: 30 días con revalidación.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|bmp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        try_files $uri =404;
    }

    # --- CSS y JS ---
    # Caché corta (1 hora) porque el desarrollo del proyecto es activo.
    location ~* \.(?:css|js)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # --- La raíz muestra el sitio ---
    # IMPORTANTE: redirige (no sirve el HTML aquí). El index.html usa rutas
    # RELATIVAS ("styles/styles.css", "../assets/img/..."), y el navegador las
    # resuelve contra la URL del documento. Si se sirviera el HTML en "/",
    # el navegador pediría /styles/styles.css y daría 404.
    # Con el redirect, la URL base pasa a ser /src/index.html y todas las rutas
    # relativas resuelven bien.
    location = / {
        return 301 /src/index.html;
    }

    # --- HTML: nunca cacheado para que los cambios se vean al instante ---
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # --- Cualquier otra ruta estática ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Healthcheck interno (no ensucia el log de acceso) ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Nunca listar directorios ---
    autoindex off;
}