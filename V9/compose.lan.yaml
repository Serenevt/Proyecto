# Compose 2.24.4+ supports !override. Database remains loopback-only.
services:
  frontend1:
    ports: !override
      - "0.0.0.0:${FRONTEND1_PORT:-8081}:80"
  frontend2:
    ports: !override
      - "0.0.0.0:${FRONTEND2_PORT:-8082}:80"
  backend:
    ports: !override
      - "0.0.0.0:${PORT:-3000}:3000"
