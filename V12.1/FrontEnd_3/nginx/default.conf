server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend ${BACKEND_UPSTREAM};

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:25443 http://localhost:25443; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /api/v1/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header x-kiosk-key;
        add_header Cache-Control "no-store" always;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ /\. { return 404; }
    location ~* \.(?:js|css|png|jpe?g|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
